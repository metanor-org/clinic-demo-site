<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metanor Clinic Suite</title>
<meta name="description" content="A multilingual clinic website and WhatsApp patient assistant by Metanor. Sample demo.">
<script>(function(){var l='ar';try{var s=localStorage.getItem('clinicSuiteLang');if(s==='en'||s==='bn'||s==='ar')l=s;}catch(e){}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  /* Layout: one patient's chat runs through the page, from the hero phone to the front desk. */
  :root {
    color-scheme: light;
    --navy: #2a4d85; --navy-deep: #1d3762; --navy-ink: #122440;
    --paper: #f4f6fa; --white: #fff; --line: #d5deeb; --muted: #566a88;
    --sky: #c5d6ef; --coral: #e4644f; --coral-deep: #b9412e;
    --green: #0b3f30; --gold: #b7924a; --gold-light: #e2c98f; --ivory: #fbf8ef;
    --chat: #e9e2d8; --chat-out: #d9fdd3; --wa-head: #0b6b58;
    --display: "Fraunces", Georgia, serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --script: "Hind Siliguri", "Noto Naskh Arabic", "Nirmala UI", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body { margin: 0; background: var(--paper); color: var(--navy-ink); font: 400 17px/1.6 var(--body); overflow-x: hidden; }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { font-family: var(--display); font-weight: 700; line-height: 1.08; letter-spacing: -.012em; text-wrap: balance; }
  h2 { font-size: clamp(2rem, 4.6vw, 3.5rem); color: var(--navy-deep); }
  h3 { font-size: 1.12rem; line-height: 1.35; font-weight: 600; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 4px; }
  .wrap { width: min(1200px, 100%); margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  section { padding-block: clamp(72px, 9vw, 128px); }
  .kicker { font-weight: 600; font-size: .92rem; color: var(--coral-deep); }
  .lead { color: var(--muted); font-size: 1.12rem; max-width: 36em; }
  .head { display: grid; gap: 14px; max-width: 760px; margin-bottom: clamp(36px, 5vw, 64px); }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 24px; border-radius: 10px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .2s, border-color .2s; }
  .btn-coral { background: var(--coral); color: #fff; }
  .btn-coral:hover { background: var(--coral-deep); }
  .btn-ghost { border: 1px solid rgba(255,255,255,.45); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,.1); }

  /* Hero */
  .hero { position: relative; color: #fff; padding-block: 10px 0; overflow: hidden; background: radial-gradient(620px 460px at 88% 62%, rgba(90,133,201,.45), transparent 68%), radial-gradient(620px 420px at 2% 105%, rgba(228,100,79,.22), transparent 65%), linear-gradient(180deg, var(--navy) 0, var(--navy) 120px, var(--navy-deep) 68%, var(--navy-ink) 100%); }
  .bar { display: flex; align-items: center; gap: 24px; }
  .logo { display: block; height: clamp(62px, 7vw, 84px); width: auto; margin-inline-start: -12px; }
  .bar nav { display: flex; gap: 22px; margin-inline-start: auto; white-space: nowrap; font-size: .96rem; font-weight: 500; }
  .bar nav a { text-decoration: none; padding-block: 6px; border-bottom: 1px solid transparent; }
  .bar nav a:hover { border-color: var(--gold-light); }
  .bar .contact-link { text-decoration: none; font-weight: 500; font-size: .95rem; white-space: nowrap; padding: 8px 16px; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; }
  .bar .contact-link:hover { background: rgba(255,255,255,.1); }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr); gap: clamp(24px, 4vw, 56px); align-items: end; padding-top: clamp(28px, 4vw, 56px); }
  .hero-copy { display: grid; gap: 22px; padding-bottom: clamp(56px, 7vw, 104px); }
  .hero .kicker { color: var(--gold-light); }
  h1 { font-size: clamp(3rem, 6.5vw, 5.7rem); }
  h1 em { font-style: italic; font-weight: 600; color: var(--gold-light); }
  .hero .lead { color: #e2eaf6; font-size: 1.2rem; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .lang-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--sky); font-size: .95rem; }
  .tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: rgba(255,255,255,.12); }
  .tabs button { border: 0; background: none; color: #fff; padding: 6px 15px; min-height: 36px; border-radius: 8px; font-family: var(--script); font-weight: 600; }
  .tabs button[aria-pressed="true"] { background: #fff; color: var(--navy-deep); }

  .scene { position: relative; min-height: clamp(470px, 46vw, 590px); }
  .browser { position: absolute; inset-inline-start: 0; top: 10px; width: 84%; background: var(--ivory); border-radius: 12px 12px 0 0; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(5,15,35,.8); }
  .chrome { display: flex; gap: 6px; padding: 11px 14px; background: #e9e3d3; }
  .chrome i { width: 9px; height: 9px; border-radius: 50%; background: #c7bea6; }
  .site-top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: var(--green); font-family: var(--display); font-weight: 600; font-size: 1rem; }
  .badge { flex: none; width: 28px; height: 32px; padding-top: 4px; border-radius: 14px 14px 2px 2px; background: var(--green); color: var(--gold-light); display: grid; place-items: center; font-size: .62rem; font-weight: 600; }
  .site-hero { position: relative; display: grid; grid-template-columns: 1.1fr .9fr; min-height: 420px; background: var(--green); color: #fff; padding: 30px 0 0 24px; gap: 14px; }
  .site-hero h4 { margin: 0; font: 600 clamp(1.4rem, 2.5vw, 2rem)/1.3 var(--script); }
  .site-arch { align-self: end; justify-self: end; width: 100%; max-width: 170px; aspect-ratio: 520/660; margin-inline-end: 20px; border-radius: 85px 85px 0 0; background: url("demos/clinic-website/assets/photos/doctor-hero.jpg") 56% 0/cover no-repeat; }

  .phone { position: absolute; inset-inline-end: 0; bottom: 0; width: min(62%, 310px); background: #0c1416; padding: 8px 8px 0; border-radius: 34px 34px 0 0; box-shadow: 0 34px 60px -24px rgba(0,0,0,.75); }
  .screen { background: var(--chat); border-radius: 27px 27px 0 0; overflow: hidden; height: clamp(400px, 37vw, 500px); display: flex; flex-direction: column; color: #16211c; }
  .chat-head { background: var(--wa-head); color: #fff; padding: 14px 14px 11px; display: flex; gap: 9px; align-items: center; font-size: .9rem; font-weight: 600; font-family: var(--script); }
  .chat-head .av { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #f7e9bd; color: #6e500f; font: 700 .68rem var(--body); display: grid; place-items: center; }
  .log { flex: 1; padding: 12px 9px; display: flex; flex-direction: column; gap: 7px; font: 500 .92rem/1.45 var(--script); overflow: hidden; }
  .bubble { max-width: 86%; padding: 6px 10px; border-radius: 9px; background: #fff; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,.1); animation: pop .32s ease-out backwards; }
  .bubble.me { background: var(--chat-out); align-self: flex-end; }
  .token { background: #eaf4ee; border: 1px solid #bfdccd; }
  .token b { display: block; font: 700 1.3rem var(--body); color: var(--green); }
  .bubble:nth-child(2) { animation-delay: .1s; } .bubble:nth-child(3) { animation-delay: .2s; } .bubble:nth-child(4) { animation-delay: .3s; } .bubble:nth-child(5) { animation-delay: .4s; }
  @keyframes pop { from { transform: translateY(8px) scale(.98); } }

  /* Journey */
  .journey { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); counter-reset: s; position: relative; }
  .journey::before { content: ""; position: absolute; top: 25px; inset-inline: 10% 10%; border-top: 2px dashed var(--sky); }
  .journey li { counter-increment: s; position: relative; display: grid; gap: 8px; justify-items: center; text-align: center; padding-inline: 12px; align-content: start; }
  .journey li::before { content: counter(s); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font: 700 1.3rem var(--display); box-shadow: 0 0 0 8px var(--paper); position: relative; }
  .journey li:last-child::before { background: var(--coral); }
  .journey h3 { margin-top: 8px; }
  .journey p { color: var(--muted); font-size: .97rem; }

  /* Product panels: real demos, scaled down */
  .products { background: var(--navy-ink); color: #fff; }
  .products h2 { color: #fff; }
  .products .kicker { color: var(--gold-light); }
  .products .lead { color: var(--sky); }
  .product { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 68px); align-items: center; text-decoration: none; }
  .product + .product { margin-top: clamp(56px, 7vw, 96px); }
  .product.flip { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
  .product.flip .shot { order: 2; }
  .shot { position: relative; aspect-ratio: 1320/820; overflow: hidden; border-radius: 12px; background: var(--navy-deep); box-shadow: 0 0 0 1px rgba(197,214,239,.25), 0 34px 60px -30px #000; transition: transform .25s; }
  .product:hover .shot { transform: translateY(-5px); }
  .shot iframe { position: absolute; top: 0; left: 0; width: 1320px; height: 820px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .product-copy { display: grid; gap: 14px; justify-items: start; }
  .product-copy h3 { font: 700 clamp(1.7rem, 3vw, 2.5rem)/1.12 var(--display); }
  .product-copy p { color: var(--sky); }
  .ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; color: #e2eaf6; font-size: .98rem; }
  .ticks li::before { content: "✓"; color: var(--gold-light); margin-inline-end: 9px; font-weight: 600; }
  .open { display: inline-flex; margin-top: 6px; padding: 11px 20px; border-radius: 9px; background: #fff; color: var(--navy-deep); font-weight: 600; }
  .product:hover .open { background: var(--gold-light); }

  /* Who handles what */
  .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 18px; overflow: hidden; box-shadow: 0 26px 50px -34px rgba(22,43,77,.6); }
  .side { padding: clamp(26px, 4vw, 48px); display: grid; gap: 18px; align-content: start; }
  .side.bot { background: var(--white); }
  .side.staff { background: var(--navy); color: #fff; }
  .side h3 { font: 700 clamp(1.5rem, 2.6vw, 2.1rem)/1.15 var(--display); }
  .side ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .side li { padding-block: 12px; border-top: 1px solid var(--line); }
  .side.staff li { border-color: rgba(255,255,255,.2); }
  .note { margin-top: 18px; color: var(--muted); max-width: 46em; }

  .gains { background: var(--white); }
  .gain-list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--navy); }
  .gain-list li { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 6px clamp(20px, 6vw, 80px); padding-block: 22px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .gain-list h3 { font: 600 clamp(1.2rem, 2vw, 1.55rem)/1.25 var(--display); color: var(--coral-deep); }

  .contact { color: #fff; background: radial-gradient(620px 340px at 88% 0, rgba(228,100,79,.3), transparent 65%), linear-gradient(160deg, var(--navy), var(--navy-deep)); }
  .contact-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) auto; gap: clamp(24px, 6vw, 70px); align-items: end; }
  .contact h2 { color: #fff; margin-bottom: 14px; font-size: clamp(2.3rem, 5.6vw, 4.4rem); }
  .contact p { color: var(--sky); font-size: 1.12rem; max-width: 34em; }
  footer { background: var(--navy-ink); color: var(--sky); padding-block: 18px; font-size: .86rem; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px; }

  @media (max-width: 980px) {
    .bar nav { display: none; }
    .hero-grid { grid-template-columns: minmax(0, 1fr); }
    .hero-copy { padding-bottom: 8px; }
    .scene { min-height: 500px; width: min(100%, 560px); margin-inline: auto; }
    .journey { grid-template-columns: minmax(0, 1fr); gap: 26px; }
    .journey::before { top: 20px; bottom: 60px; inset-inline: 25px auto; border-top: 0; border-inline-start: 2px dashed var(--sky); }
    .journey li { grid-template-columns: 52px minmax(0, 1fr); justify-items: start; text-align: start; padding-inline: 0; column-gap: 18px; }
    .journey li::before { grid-row: span 2; }
    .journey h3 { margin-top: 0; }
    .product, .product.flip, .split, .contact-grid, .gain-list li { grid-template-columns: minmax(0, 1fr); }
    .product.flip .shot { order: 0; }
  }
  @media (max-width: 480px) {
    .cta .btn { width: 100%; }
    .scene { min-height: 450px; }
    .browser { display: none; }
    .phone { inset-inline: 0; margin-inline: auto; width: min(84%, 310px); }
    .contact .btn { white-space: normal; overflow-wrap: anywhere; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .bubble { animation: none; } .shot, .btn { transition: none; } }

  html[lang="ar"] { --display: "Alexandria", "Segoe UI", Tahoma, sans-serif; --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; }
  html[lang="bn"] { --display: "Hind Siliguri", "Nirmala UI", "Segoe UI", sans-serif; --body: "Hind Siliguri", "Nirmala UI", "Segoe UI", sans-serif; }
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="bn"] h1, html[lang="bn"] h2 { line-height: 1.32; letter-spacing: 0; font-weight: 600; }
  html[lang="ar"] h1 em, html[lang="bn"] h1 em { font-style: normal; }
  html[lang="ar"] h1, html[lang="bn"] h1 { font-size: clamp(2.5rem, 5vw, 4.3rem); }
  .bar .tabs { margin-inline-start: 0; flex: none; }
  .bar nav + .tabs { margin-inline-start: 4px; }
  .bar .contact-link { flex: none; }
  .logo { direction: ltr; }
  .site-hero { padding: 30px 0 0; padding-inline-start: 24px; }
  .site-hero h4 { padding-inline-end: 8px; }
  .chooser { position: fixed; inset: 0; margin: auto; height: fit-content; max-height: calc(100dvh - 24px); overflow-y: auto; }
  .tiers-band { background: var(--white); }
  .tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 24px); align-items: stretch; }
  .tier { position: relative; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 16px; padding: clamp(22px, 2.6vw, 32px); min-width: 0; }
  .tier.main { background: var(--navy-deep); border-color: var(--navy-deep); color: #fff; }
  .tier h3 { font: 700 clamp(1.5rem, 2.4vw, 2rem)/1.2 var(--display); color: var(--navy-deep); }
  .tier.main h3 { color: #fff; }
  .tier-sub { color: var(--muted); }
  .tier.main .tier-sub { color: var(--sky); }
  .pop { align-self: flex-start; background: var(--gold-light); color: var(--navy-ink); font-size: .82rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
  .tier ul { list-style: none; margin: 12px 0 18px; padding: 0; display: grid; gap: 9px; font-size: .98rem; flex: 1; align-content: start; }
  .tier li { position: relative; padding-inline-start: 22px; }
  .tier li::before { content: "✓"; position: absolute; inset-inline-start: 0; color: var(--coral-deep); font-weight: 700; }
  .tier.main li::before { color: var(--gold-light); }
  .tier li.inherit { font-weight: 600; }
  .tier-go { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 9px; border: 1px solid var(--navy); color: var(--navy-deep); font-weight: 600; text-decoration: none; }
  .tier-go:hover { background: var(--paper); }
  .tier.main .tier-go { background: var(--coral); border-color: var(--coral); color: #fff; }
  .tier.main .tier-go:hover { background: var(--coral-deep); }
  .tier-note { margin-top: 20px; color: var(--muted); }
  .chooser { border: 0; border-radius: 20px; padding: clamp(24px, 4vw, 40px); width: min(460px, calc(100vw - 32px)); background: var(--navy); color: #fff; text-align: center; }
  .chooser::backdrop { background: rgba(18,36,64,.78); }
  .chooser img { height: 76px; width: auto; margin-inline: auto; display: block; }
  .chooser h2 { color: #fff; font: 600 1.15rem/1.5 var(--script); display: grid; gap: 2px; margin-block: 8px 20px; letter-spacing: 0; }
  .choices { display: grid; gap: 10px; }
  .choices button { min-height: 58px; border-radius: 12px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; font: 600 1.25rem var(--script); }
  .choices button:hover { background: #fff; color: var(--navy-deep); }
  @media (max-width: 980px) { .tiers { grid-template-columns: minmax(0, 1fr); } .bar .tabs { margin-inline-start: auto; } }
  @media (max-width: 620px) { .bar { flex-wrap: wrap; gap: 8px 12px; } .bar .contact-link { display: none; } .tabs button { padding: 6px 10px; } }
</style>
</head>
<body>

<dialog class="chooser" id="chooser" aria-labelledby="chooseTitle">
  <img src="assets/metanor-logo.png" alt="Metanor" width="614" height="200">
  <h2 id="chooseTitle"><span lang="ar" dir="rtl">اختر لغتك</span><span lang="en">Choose your language</span><span lang="bn">আপনার ভাষা বেছে নিন</span></h2>
  <div class="choices">
    <button type="button" data-choose="ar" lang="ar" dir="rtl">العربية</button>
    <button type="button" data-choose="en" lang="en">English</button>
    <button type="button" data-choose="bn" lang="bn">বাংলা</button>
  </div>
</dialog>

<header class="hero">
  <div class="wrap">
    <div class="bar">
      <img class="logo" src="assets/metanor-logo.png" alt="Metanor" width="614" height="200">
      <nav aria-label="Main">
        <a href="#journey" data-t="navHow"></a>
        <a href="#demos" data-t="navDemos"></a>
        <a href="#packages" data-t="navPackages"></a>
      </nav>
      <div class="tabs" role="group" aria-label="Language">
        <button type="button" data-lang="ar" lang="ar">العربية</button>
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="bn" lang="bn">বাংলা</button>
      </div>
      <a class="contact-link" href="#contact" data-t="navContact"></a>
    </div>
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="kicker">Metanor Clinic Suite</p>
        <h1><span data-t="h1a"></span> <em data-t="h1b"></em></h1>
        <p class="lead" data-t="lede"></p>
        <div class="cta">
          <a class="btn btn-coral" href="demos/whatsapp-assistant/" data-t="ctaWa"></a>
          <a class="btn btn-ghost" href="demos/clinic-website/" data-t="ctaSite"></a>
        </div>
      </div>
      <div class="scene" role="img" data-t-label="sceneAlt">
        <div class="browser">
          <div class="chrome"><i></i><i></i><i></i></div>
          <div class="site-top"><span class="badge">SM</span><span data-t="clinic"></span></div>
          <div class="site-hero"><h4 data-t="siteTitle"></h4><div class="site-arch"></div></div>
        </div>
        <div class="phone"><div class="screen">
          <div class="chat-head"><span class="av">SM</span><span data-t="clinic"></span></div>
          <div class="log" id="log"></div>
        </div></div>
      </div>
    </div>
  </div>
</header>

<main>
  <section id="journey">
    <div class="wrap">
      <div class="head"><p class="kicker" data-t="howEye"></p><h2 data-t="howTitle"></h2></div>
      <ol class="journey" id="steps"></ol>
    </div>
  </section>

  <section class="products" id="demos">
    <div class="wrap">
      <div class="head"><p class="kicker" data-t="demoEye"></p><h2 data-t="demoTitle"></h2><p class="lead" data-t="demoLead"></p></div>
      <a class="product" href="demos/clinic-website/">
        <div class="shot"><iframe src="demos/clinic-website/" title="Clinic website preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
        <div class="product-copy"><h3 data-t="siteH"></h3><p data-t="siteP"></p><ul class="ticks" id="siteTicks"></ul><span class="open" data-t="siteGo"></span></div>
      </a>
      <a class="product flip" href="demos/whatsapp-assistant/">
        <div class="shot"><iframe src="demos/whatsapp-assistant/" title="WhatsApp assistant preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
        <div class="product-copy"><h3 data-t="waH"></h3><p data-t="waP"></p><ul class="ticks" id="waTicks"></ul><span class="open" data-t="waGo"></span></div>
      </a>

      if (x.main) c.append(make('span', 'pop', t.popular));
      c.append(make('h3', '', x.n), make('p', 'tier-sub', x.s));
      const ul = make('ul'); x.i.forEach((f, j) => ul.append(make('li', i > 0 && j === 0 ? 'inherit' : '', f)));
      const a = make('a', 'tier-go', t.tryTier); a.href = `demos/whatsapp-assistant/#tier${i + 1}`;
      c.append(ul, a);
      return c;
    }));
  }

  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang === lang) return; lang = b.dataset.lang; save(); render(); reloadPreviews(); }));
  const dlg = $('chooser');
  dlg.querySelectorAll('[data-choose]').forEach(b => b.addEventListener('click', () => { const changed = b.dataset.choose !== lang; lang = b.dataset.choose; save(); render(); dlg.close(); if (changed) reloadPreviews(); }));
  dlg.addEventListener('cancel', () => { save(); });

  const fit = shot => { shot.firstElementChild.style.transform = `scale(${shot.clientWidth / 1320})`; };
  const shots = document.querySelectorAll('.shot');
  shots.forEach(fit);
  if ('ResizeObserver' in window) { const w = new ResizeObserver(es => es.forEach(e => fit(e.target))); shots.forEach(s => w.observe(s)); }
  else addEventListener('resize', () => shots.forEach(fit));

  render();
  let seen = false;
  try { seen = sessionStorage.getItem('clinicSuiteChosen') === '1'; } catch (e) {}
  if (!seen && dlg.showModal) dlg.showModal();
})();
</script>
</body>
</html>
